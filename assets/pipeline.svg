<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">Progressive hybrid learning pipeline</title>
<desc id="d">Stage 1 Rule-Based, Stage 2 Fuzzy Q-Learning, Stage 3 Deep Q-Network distilled into a small Q-table for the RP2040.</desc>
<defs>
<style>
@font-face{font-family:'FPSans';font-weight:100 900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'FPMono';font-weight:100 900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}

.sans{font-family:'FPSans',ui-sans-serif,system-ui,sans-serif;font-weight:700;word-spacing:.06em}
.mono{font-family:'FPMono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


.chev{animation:chev 1.6s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25;transform:translateX(-3px)}50%{opacity:1;transform:translateX(3px)}}

</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#18212C"/></pattern>
<clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="300" fill="#0A0E14"/>
<rect width="1000" height="300" fill="url(#dots)"/>
<rect x="24" y="30" width="286" height="222" rx="14" fill="#111821" stroke="#2A3644" stroke-width="1.5"/>
<rect x="42" y="28.5" width="250" height="3" rx="1.5" fill="#3FB950"/>
<text x="44" y="64" class="mono" font-size="12.5" fill="#3FB950" text-anchor="start" letter-spacing="2">STAGE 1</text>
<text x="44" y="96" class="sans" font-size="23" fill="#E6EDF3" text-anchor="start" >Rule-Based</text>
<text x="44" y="132" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >day-1 cold start</text>
<text x="44" y="158" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >hard pH + T thresholds</text>
<text x="44" y="184" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >guardrail in every stage</text>
<line x1="44" y1="206" x2="290" y2="206" stroke="#2A3644"/>
<text x="44" y="232" class="mono" font-size="13" fill="#3FB950" text-anchor="start" >runs on RP2040</text>
<rect x="357" y="30" width="286" height="222" rx="14" fill="#111821" stroke="#2A3644" stroke-width="1.5"/>
<rect x="375" y="28.5" width="250" height="3" rx="1.5" fill="#3DDCFF"/>
<text x="377" y="64" class="mono" font-size="12.5" fill="#3DDCFF" text-anchor="start" letter-spacing="2">STAGE 2</text>
<text x="377" y="96" class="sans" font-size="23" fill="#E6EDF3" text-anchor="start" >Fuzzy Q-Learning</text>
<text x="377" y="132" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >learns online, no dataset</text>
<text x="377" y="158" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >5 pH × 5 T = 25 rules</text>
<text x="377" y="184" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >Q-table ≈ 144 bytes</text>
<line x1="377" y1="206" x2="623" y2="206" stroke="#2A3644"/>
<text x="377" y="232" class="mono" font-size="13" fill="#3DDCFF" text-anchor="start" >runs on RP2040</text>
<rect x="690" y="30" width="286" height="222" rx="14" fill="#111821" stroke="#2A3644" stroke-width="1.5"/>
<rect x="708" y="28.5" width="250" height="3" rx="1.5" fill="#F5A524"/>
<text x="710" y="64" class="mono" font-size="12.5" fill="#F5A524" text-anchor="start" letter-spacing="2">STAGE 3</text>
<text x="710" y="96" class="sans" font-size="23" fill="#E6EDF3" text-anchor="start" >Deep Q-Network</text>
<text x="710" y="132" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >unlocks at ≥ 10k samples</text>
<text x="710" y="158" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >2→64→64→4 MLP + replay</text>
<text x="710" y="184" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >distilled to a ~5 KB table</text>
<line x1="710" y1="206" x2="956" y2="206" stroke="#2A3644"/>
<text x="710" y="232" class="mono" font-size="13" fill="#F5A524" text-anchor="start" >trains on RPi 5 → RP2040</text>
<path class="chev" style="animation-delay:0.0s" d="M326.5,130.0 L338.5,141.0 L326.5,152.0" fill="none" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="chev" style="animation-delay:0.5s" d="M659.5,130.0 L671.5,141.0 L659.5,152.0" fill="none" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="500.0" y="278" class="mono" font-size="13.5" fill="#5B6675" text-anchor="middle" >Rule-Based guardrails stay active while FQL and DQN take over</text>
</g>
</svg>
