<text x="366" y="40" class="mono" font-size="12.5" fill="#5B6675" text-anchor="start" letter-spacing="2">EDGE HUB</text>
<text x="706" y="40" class="mono" font-size="12.5" fill="#5B6675" text-anchor="start" letter-spacing="2">EDGE COMPUTE</text>
<g fill="none" stroke-width="2.4" stroke-linecap="round">
