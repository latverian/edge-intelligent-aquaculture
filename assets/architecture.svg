<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">System architecture</title>
<desc id="d">Pico WH nodes stream pH and temperature through an N3IWF edge hub to a Raspberry Pi 5 that trains FQL/DQN, distills a Q-table back to the nodes, and serves a live dashboard.</desc>
<defs>
<style>
@font-face{font-family:'FPSans';font-weight:100 900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'FPMono';font-weight:100 900;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}

.sans{font-family:'FPSans',ui-sans-serif,system-ui,sans-serif;font-weight:700;word-spacing:.06em}
.mono{font-family:'FPMono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


.flow{stroke-dasharray:7 11;animation:flow 1.4s linear infinite}
@keyframes flow{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}

</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#18212C"/></pattern>
<clipPath id="frame"><rect width="1000" height="500" rx="18"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="500" fill="#0A0E14"/>
<rect width="1000" height="500" fill="url(#dots)"/>
