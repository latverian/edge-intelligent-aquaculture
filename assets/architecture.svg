<rect x="24" y="64" width="262" height="104" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5"/><rect x="24" y="78" width="3" height="76" rx="1.5" fill="#3FB950"/>
<text x="42" y="96" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >Pico WH · node 1</text><text x="42" y="120" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >pH + DS18B20 sensors</text><text x="42" y="144" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >O(1) Q-table inference</text>
<rect x="24" y="186" width="262" height="104" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5"/><rect x="24" y="200" width="3" height="76" rx="1.5" fill="#3FB950"/>
<text x="42" y="218" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >Pico WH · node 2</text><text x="42" y="242" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >pH + DS18B20 sensors</text><text x="42" y="266" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >O(1) Q-table inference</text>
<rect x="24" y="308" width="262" height="104" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="24" y="322" width="3" height="76" rx="1.5" fill="#3FB950"/>
<text x="42" y="340" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >Pico WH · node N</text><text x="42" y="364" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >same firmware,</text><text x="42" y="388" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >scale out over Wi-Fi</text>
<rect x="362" y="160" width="262" height="176" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5"/><rect x="362" y="174" width="3" height="148" rx="1.5" fill="#3DDCFF"/>
<text x="380" y="192" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >N3IWF hub</text><text x="380" y="214" class="mono" font-size="13" fill="#3DDCFF" text-anchor="start" >Local Edge Services</text><text x="380" y="238" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >IPsec IKEv2 tunnel</text><text x="380" y="262" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >TCP hub for all nodes</text><text x="380" y="286" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >works without internet</text><text x="380" y="310" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >runs on the RPi 5</text>
<rect x="702" y="64" width="274" height="214" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5"/><rect x="702" y="78" width="3" height="186" rx="1.5" fill="#F5A524"/>
<text x="720" y="96" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >Raspberry Pi 5</text><text x="720" y="118" class="mono" font-size="13" fill="#F5A524" text-anchor="start" >edge trainer</text><text x="720" y="142" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >pond simulator pre-train</text><text x="720" y="166" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >replay buffer</text><text x="720" y="190" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >FQL / DQN training</text><text x="720" y="214" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >distill → 50×50 Q-table</text><text x="720" y="238" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >export over N3IWF</text>
<rect x="702" y="304" width="274" height="116" rx="12" fill="#111821" stroke="#2A3644" stroke-width="1.5"/><rect x="702" y="318" width="3" height="88" rx="1.5" fill="#3DDCFF"/>
<text x="720" y="336" class="sans" font-size="19" fill="#E6EDF3" text-anchor="start" >Live dashboard</text><text x="720" y="360" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >pH · T · NH₃ risk level</text><text x="720" y="384" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >latency · convergence</text><text x="720" y="408" class="mono" font-size="14.5" fill="#8B949E" text-anchor="start" >phase · ε · buffer size</text>
<line x1="28" y1="462" x2="58" y2="462" stroke="#3DDCFF" stroke-width="3" stroke-linecap="round"/>
<text x="68" y="467" class="mono" font-size="13.5" fill="#8B949E" text-anchor="start" >sensor stream (pH, T)</text>
<line x1="294" y1="462" x2="324" y2="462" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
<text x="334" y="467" class="mono" font-size="13.5" fill="#8B949E" text-anchor="start" >policy update (Q-table)</text>
<text x="976" y="467" class="mono" font-size="13.5" fill="#5B6675" text-anchor="end" >local Wi-Fi · no cloud</text>
</g>
</svg>
